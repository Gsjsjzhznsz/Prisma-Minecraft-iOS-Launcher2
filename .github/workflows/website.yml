# ★ Task259（清单 9）：启动器介绍站（Astro）发布到 GitHub Pages。
# 触发：website/** 变更或手动；公告在构建期经 scripts/sync-announcements.mjs
# 与仓库 main 的 announcements.json 单一事实源同步。
name: Deploy website (GitHub Pages)

# Task315（6.5.5 同步随入修正）：本仓库为 7.0 测试专用，与 development.yml
# /ui-smoke.yml 同红线——push 自动触发拆除。合并触碰 website/** 曾自动拉起
# deploy，而本仓未启用 GitHub Pages（GET /pages 404），deploy-pages@v4 必败；
# 仅保留手动 dispatch 供需要时取证预览，网站正发布仍走主仓。
on:
  workflow_dispatch:
  # Task291: daily rebuild keeps the build-time latest-release tag and
  # announcements fresh even when main is quiet.
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      # Task291: detect the latest STABLE release (non-prerelease, non-draft)
      # server-side with gh (authenticated 1000 req/h, immune to the
      # client-side rate-limit pain) and bake it into the Astro build as
      # PUBLIC_LATEST_TAG. index.astro falls back to the static v6.5.0
      # when detection fails. The old static v6.5.5 was a prerelease beta
      # -- root cause of the site advertising a beta as the stable pick.
      - name: Detect latest stable release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false)][0].tagName' 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "PUBLIC_LATEST_TAG=$TAG" >> "$GITHUB_ENV"
            echo "Baked latest stable release tag: $TAG"
          else
            echo "Detection failed; Astro falls back to the baked static v6.5.0"
          fi
      - name: Install & build
        working-directory: website
        run: |
          npm ci || npm install --no-fund --no-audit
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
