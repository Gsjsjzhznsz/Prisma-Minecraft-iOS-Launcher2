name: UI Fluent smoke (7.0 test repo - frontend preview)

# 7.0-UI-7：前端专用冒烟——AmeTheme 令牌层 + Fluent 组件库 + 已迁移 VC 的
# 语法门禁（-fsyntax-only）与模拟器渲染预览（侧栏 Navigation Rail + 8 件套
# 浅/深两态截图）。
# 红线：本仓库仅出测试验证，不上传发行版——本 workflow 无任何 release 步骤；
# 触发 = workflow_dispatch 手动 + 窄路径 push 自动（预览/冒烟文件变更）；
# 完整出包仍走 development.yml（push 自动）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke mode: syntax / preview / all"
        required: false
        default: "all"
  # ★Task419 窄路径 push 自动触发：预览 harness / 冒烟脚本 / 本工作流自身
  #   变更即自动出模拟器截图可视验证（今天 dispatch API 持续 404 的旁路，
  #   亦是「harness 与真机分叉」类病灶不再漏过的结构性保障；触发面窄 =
  #   日常推送不烧 macOS 时长）
  push:
    branches: [main]
    paths:
      - "Natives/Preview/**"
      - "Natives/BuildTag.h"        # ★Task421：代际角标常量（预览卡渲染面；tag 变更即重出冒烟截图 = CI 代际证据自动更新）
      - "Natives/ZL2SkinPreviewView.m"   # ★Task424：预览本体渲染/控件面（光影盘/亮度条/姿态四段首上 CI 可视验证）
      - "Natives/resources/**"      # ★Task424：姿态/光影 i18n 键上屏面（冒烟截图即四表可视仲裁）
      - "scripts/ui_fluent_smoke.sh"
      - ".github/workflows/ui-smoke.yml"

# 与 development.yml 分组隔离：前端冒烟不取消完整构建，反之亦然
concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: UI Fluent smoke
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          echo "simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes available | head -8
          xcrun simctl list devices available | grep -m3 iPhone || true

      - name: Run UI Fluent smoke
        run: bash scripts/ui_fluent_smoke.sh "${{ github.event.inputs.mode || 'all' }}"

      - name: Upload preview artifacts (screenshots + failure logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ame-fluent-preview
          path: |
            build/ame-preview/*.png
            build/ame-preview/*.log
          if-no-files-found: ignore
